version: '3.1'

services:
  web:
    container_name: web
    build:
      context: praxsa_manager/
      dockerfile: Dockerfile
    volumes:
      - static:/praxsa_manager/staticfiles
    restart: always
    expose:
      - "5000"
    networks:
      - proxy
    depends_on:
      - db
    deploy:
      resources:
        limits:
          memory: 100M

  
  nginx:
    container_name: nginx
    build:
      context: nginx/
      dockerfile: Dockerfile.stg
    expose:
      - "80" 
    deploy:
      resources:
        limits:
          memory: 100M
    environment:
      - VIRTUAL_HOST=panel.oscarleon.website,www.panel.oscarleon.website,oscarleon.website,laminas.oscarleon.website,www.laminas.oscarleon.website
      - LETSENCRYPT_HOST=panel.oscarleon.website,www.panel.oscarleon.website,oscarleon.website,laminas.oscarleon.website,www.laminas.oscarleon.website
      - LETSENCRYPT_EMAIL=roleonm@gmail.com
    volumes:
      - static:/praxsa_manager/staticfiles
      # - laminas:/etc/nginx/html
    networks:
      - proxy
    depends_on:
      - web

  proforma:
    container_name: proforma
    build:
      context: proforma/
      dockerfile: Dockerfile.stg
    restart: always
    volumes:
      - laminas:/app/dist/proforma/browser
    expose:
      - "4000"
    networks:
      - proxy
    depends_on:
      - web
    deploy:
      resources:
        limits:
          memory: 2.5G

  db:
    container_name: db
    image: postgres
    restart: always
    env_file: praxsa_manager/.env
    volumes:
      - postgres:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - proxy
    deploy:
      resources:
        limits:
          memory: 100M

  # adminer:
  #   image: adminer
  #   restart: always
  #   ports:
  #     - 8080:8080
  #   networks:
  #     - nginx_nw

volumes:
  postgres:
    external: true
  static:
    external: true
  laminas:
    external: true

networks:
  proxy:
    external: true