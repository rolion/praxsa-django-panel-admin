version: '3.1'

services:
  db:
    container_name: db
    image: postgres
    restart: always
    env_file: praxsa_manager/.env
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - 5432:5432
    networks:
      - web_nw
    deploy:
      resources:
        limits:
          memory: 100M

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
    networks:
      - web_nw

volumes:
  postgres:
    external: true

networks:
  web_nw:
    external: true