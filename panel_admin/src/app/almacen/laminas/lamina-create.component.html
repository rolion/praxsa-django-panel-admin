<section class="main-content">
  <ul class="breadcrumb breadcrumb-style">
    <li class="breadcrumb-item">
      <h5 class="page-title m-b-0">Nueva lámina</h5>
    </li>
    <li class="breadcrumb-item bcrumb-1"><a routerLink="/almacen/laminas"><i class="fas fa-layer-group font-17"></i></a></li>
    <li class="breadcrumb-item">Láminas</li>
  </ul>
  <div class="section-body">
    <div class="row clearfix">
      <div class="col-lg-8 col-md-12">
        <div class="card">
          <div class="card-body">
            <form [formGroup]="form" (ngSubmit)="save()">
              <div class="mb-3">
                <label class="fw-bold">Nombre</label>
                <input type="text" class="form-control" formControlName="name" />
                @if (form.get('name')?.invalid && submitted) {
                  <small class="form-text text-danger">El nombre es obligatorio</small>
                }
              </div>
              <div class="mb-3">
                <label class="fw-bold">Descripción</label>
                <textarea class="form-control" formControlName="description" rows="3"></textarea>
                @if (form.get('description')?.invalid && submitted) {
                  <small class="form-text text-danger">La descripción es obligatoria</small>
                }
              </div>
              <div class="mb-3">
                <label class="fw-bold">Imagen de la lámina</label>
                <app-image-upload formControlName="image"></app-image-upload>
              </div>
              @if (errorMessage) {
                <div class="alert alert-danger">{{ errorMessage }}</div>
              }
              <button type="submit" class="btn btn-primary" [disabled]="saving">Crear lámina</button>
              <a routerLink="/almacen/laminas" class="btn btn-light">Cancelar</a>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
