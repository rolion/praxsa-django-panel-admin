<section class="main-content">
  <ul class="breadcrumb breadcrumb-style">
    <li class="breadcrumb-item">
      <h5 class="page-title m-b-0">Gestionar inventario</h5>
    </li>
    <li class="breadcrumb-item bcrumb-1"><a routerLink="/almacen/inventario"><i class="fas fa-boxes font-17"></i></a></li>
    <li class="breadcrumb-item">Inventario</li>
  </ul>
  <div class="section-body">
    <div class="row clearfix">
      <div class="col-lg-8 col-md-12">
        <div class="card">
          <div class="card-body">
            @if (loading) {
              <p>Cargando...</p>
            } @else {
              <form [formGroup]="form" (ngSubmit)="save()">
                <div class="mb-3">
                  <label>Metros disponibles para instalar <span class="text-danger">*</span></label>
                  <input type="number" step="0.01" class="form-control" formControlName="to_install" required />
                </div>
                <div class="mb-3">
                  <label>Metros instalados <span class="text-danger">*</span></label>
                  <input type="number" step="0.01" class="form-control" formControlName="installed" required />
                </div>
                <div class="mb-3">
                  <label>Precio compra metro lineal <span class="text-danger">*</span></label>
                  <input type="number" step="0.01" class="form-control" formControlName="precio_compra_mtr_lineal" required />
                </div>
                <div class="mb-3">
                  <label>Precio venta metro lineal <span class="text-danger">*</span></label>
                  <input type="number" step="0.01" class="form-control" formControlName="precio_venta_mtr_lineal" required />
                </div>
                <div class="mb-3">
                  <label>Nro. lote</label>
                  <input type="text" class="form-control" formControlName="nro_lote" />
                </div>
                @if (errorMessage) {
                  <div class="alert alert-danger">{{ errorMessage }}</div>
                }
                <button type="submit" class="btn btn-primary" [disabled]="form.invalid || saving">Guardar</button>
                <a routerLink="/almacen/inventario" class="btn btn-light">Cancelar</a>
              </form>
            }
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
