<main class="d-flex align-items-center min-vh-100 py-3 py-md-0">
  <div class="container">
    <div class="card login-card mb-0">
      <div class="row no-gutters">
        <div class="col-md-5">
          <img src="assets/images/praxsa-login-hero.png" alt="PRAXSA Window Film" class="login-card-img">
          </div>
          <div class="col-md-7">
            <div class="login-body">
              <div class="text-center">
                <div class="brand-wrapper">
                  <img src="assets/images/praxsa-admin-logo.png" alt="PRAXSA Admin" class="login-brand-logo">
                </div>
              </div>
              <form class="validate-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                <div class="row">
                  <div class="col-lg-12">
                    <div class="form-group position-relative">
                      <label>Usuario <span class="text-danger">*</span></label>
                      <i-feather name="user" class="login-icons"></i-feather>
                      <input type="text" class="form-control psl-5" formControlName="username" placeholder="Usuario">
                      </div>
                    </div>
                    <div class="col-lg-12">
                      <div class="form-group position-relative">
                        <label>Contraseña <span class="text-danger">*</span></label>
                        <i-feather name="key" class="login-icons"></i-feather>
                        <input type="password" class="form-control psl-5" formControlName="password"
                          placeholder="Contraseña">
                        </div>
                      </div>
                      <div class="col-lg-12">
                        @if (error) {
                          <div class="alert alert-danger mb-3 msl-3">{{error}}</div>
                        }
                        <div class="col-lg-12 mb-0">
                          <button class="btn btn-primary auth-form-btn">Ingresar</button>
                        </div>
                      </div>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
