<section class="main-content">
  <ul class="breadcrumb breadcrumb-style">
    <li class="breadcrumb-item">
      <h5 class="page-title m-b-0">Modelos</h5>
    </li>
    <li class="breadcrumb-item bcrumb-1">
      <a routerLink="/dashboard/main"><i class="fas fa-home font-17"></i></a>
    </li>
    <li class="breadcrumb-item">Modelos</li>
  </ul>
  <div class="section-body">
    <div class="row clearfix">
      <div class="col-12">
        <div class="card">
          <div class="p-10">
            <div class="row">
              <div class="col-lg-6">
                <div class="row m-0">
                  <div class="col-auto p-0">
                    <div class="ngxTableHeader">
                      <div class="table-title">
                        <h2><strong>Modelos</strong></h2>
                      </div>
                    </div>
                  </div>
                  <div class="col-lg-8 p-0">
                    <div class="ngxTableHeader">
                      <div class="table-search-area">
                        <div>
                          <label for="search-input"><i class="material-icons search-icon">search</i></label>
                          <input placeholder="Buscar por nombre o marca" type="text" class="browser-default search-field"
                            (keyup)="filterDatatable($event)" aria-label="Search box" />
                        </div>
                      </div>
                      <div class="header-buttons-left">
                        <div class="tbl-btn-style">
                          <a routerLink="/vehicles/models/create" class="btn btn-icon icon-left btn-primary rounded-button">
                            <i class="material-icons">add</i>
                          </a>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            @if (errorMessage) {
              <div class="alert alert-danger m-3">{{ errorMessage }}</div>
            }
            <ngx-datatable
              class="material"
              [rows]="rows"
              [loadingIndicator]="loadingIndicator"
              columnMode="force"
              [headerHeight]="50"
              [footerHeight]="50"
              rowHeight="auto"
              [limit]="10"
            >
              <ngx-datatable-column name="Imagen" [sortable]="false" [width]="90">
                <ng-template let-row="row" ngx-datatable-cell-template>
                  @if (row.image && !failedImageIds.has(row.id)) {
                    <img [src]="row.image" (error)="failedImageIds.add(row.id)" class="data-table-img" alt="Imagen del modelo" />
                  } @else {
                    <i class="fas fa-image text-muted"></i>
                  }
                </ng-template>
              </ngx-datatable-column>
              <ngx-datatable-column name="Marca" prop="car_brand_name"></ngx-datatable-column>
              <ngx-datatable-column name="Modelo" prop="name"></ngx-datatable-column>
              <ngx-datatable-column name="Cantidad de items" prop="items_count" [width]="150"></ngx-datatable-column>
              <ngx-datatable-column name="Acciones" [sortable]="false" [width]="160">
                <ng-template let-row="row" ngx-datatable-cell-template>
                  <a [routerLink]="['/vehicles/models/view', row.id]" class="btn btn-tbl-view h-auto" title="Ver">
                    <i class="fas fa-eye"></i>
                  </a>
                  <a [routerLink]="['/vehicles/models/edit', row.id]" class="btn btn-tbl-edit h-auto" title="Editar">
                    <i class="fas fa-pen"></i>
                  </a>
                  @if (row.is_active) {
                    <button type="button" class="btn btn-tbl-delete h-auto" title="Eliminar" (click)="deactivate(row)">
                      <i class="far fa-trash-alt"></i>
                    </button>
                  } @else {
                    <button type="button" class="btn btn-tbl-activate h-auto" title="Activar" (click)="activate(row)">
                      <i class="fas fa-user-check"></i>
                    </button>
                  }
                </ng-template>
              </ngx-datatable-column>
            </ngx-datatable>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
