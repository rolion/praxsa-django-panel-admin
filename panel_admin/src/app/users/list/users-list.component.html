<section class="main-content">
  <ul class="breadcrumb breadcrumb-style">
    <li class="breadcrumb-item">
      <h5 class="page-title m-b-0">Credenciales</h5>
    </li>
    <li class="breadcrumb-item bcrumb-1">
      <a routerLink="/dashboard/main"><i class="fas fa-home font-17"></i></a>
    </li>
    <li class="breadcrumb-item">Credenciales</li>
  </ul>
  <div class="section-body">
    <div class="row clearfix">
      <div class="col-12">
        <div class="card">
          <div class="p-3 d-flex justify-content-between align-items-center flex-wrap gap-2">
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                id="includeInactive"
                [(ngModel)]="includeInactive"
                (change)="onToggleIncludeInactive()"
              />
              <label class="form-check-label" for="includeInactive">Mostrar inactivos</label>
            </div>
            <a routerLink="/users/create" class="btn btn-primary">Nueva credencial</a>
          </div>
          @if (errorMessage) {
            <div class="alert alert-danger m-3">{{ errorMessage }}</div>
          }
          <ngx-datatable
            class="material"
            [rows]="rows"
            [loadingIndicator]="loadingIndicator"
            columnMode="force"
            [headerHeight]="50"
            [footerHeight]="50"
            rowHeight="auto"
            [limit]="10"
          >
            <ngx-datatable-column name="Usuario" prop="username"></ngx-datatable-column>
            <ngx-datatable-column name="Correo" prop="email"></ngx-datatable-column>
            <ngx-datatable-column name="Nombre" prop="first_name"></ngx-datatable-column>
            <ngx-datatable-column name="Apellido" prop="last_name"></ngx-datatable-column>
            <ngx-datatable-column name="Teléfono" prop="phone_number"></ngx-datatable-column>
            <ngx-datatable-column name="Estado" [sortable]="false">
              <ng-template let-row="row" ngx-datatable-cell-template>
                @if (row.is_active) {
                  <span class="badge bg-success">Activo</span>
                } @else {
                  <span class="badge bg-secondary">Inactivo</span>
                }
              </ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column name="Acciones" [sortable]="false" [width]="160">
              <ng-template let-row="row" ngx-datatable-cell-template>
                <a
                  [routerLink]="['/users/view', row.id]"
                  class="btn btn-tbl-view h-auto"
                  title="Ver"
                >
                  <i class="fas fa-eye"></i>
                </a>
                <a
                  [routerLink]="['/users/edit', row.id]"
                  class="btn btn-tbl-edit h-auto"
                  title="Editar"
                >
                  <i class="fas fa-pen"></i>
                </a>
                @if (row.is_active) {
                  <button
                    type="button"
                    class="btn btn-tbl-delete h-auto"
                    title="Eliminar"
                    (click)="deactivate(row)"
                  >
                    <i class="far fa-trash-alt"></i>
                  </button>
                } @else {
                  <button
                    type="button"
                    class="btn btn-tbl-activate h-auto"
                    title="Activar"
                    (click)="activate(row)"
                  >
                    <i class="fas fa-user-check"></i>
                  </button>
                }
              </ng-template>
            </ngx-datatable-column>
          </ngx-datatable>
        </div>
      </div>
    </div>
  </div>
</section>
