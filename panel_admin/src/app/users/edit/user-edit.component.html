<section class="main-content">
  <ul class="breadcrumb breadcrumb-style">
    <li class="breadcrumb-item">
      <h5 class="page-title m-b-0">Editar credencial</h5>
    </li>
    <li class="breadcrumb-item bcrumb-1"><a routerLink="/users"><i class="fas fa-users font-17"></i></a></li>
    <li class="breadcrumb-item">Credenciales</li>
  </ul>
  <div class="section-body">
    <div class="row clearfix">
      <div class="col-lg-8 col-md-12">
        <div class="card">
          <div class="card-body">
            @if (loading) {
              <p>Cargando...</p>
            } @else {
              @if (errorMessage) {
                <div class="alert alert-danger">{{ errorMessage }}</div>
              }
              <form [formGroup]="form" (ngSubmit)="save()">
                <div class="mb-3">
                  <label class="form-label">Nombre</label>
                  <input type="text" class="form-control" formControlName="first_name" />
                </div>
                <div class="mb-3">
                  <label class="form-label">Apellido</label>
                  <input type="text" class="form-control" formControlName="last_name" />
                </div>
                <div class="mb-3">
                  <label class="form-label">Correo</label>
                  <input type="email" class="form-control" formControlName="email" />
                </div>
                <div class="mb-3">
                  <label class="form-label">Teléfono</label>
                  <input type="text" class="form-control" formControlName="phone_number" />
                </div>
                <div class="mb-3">
                  <label class="form-label">Grupos</label>
                  <ng-select [items]="groups" bindLabel="name" bindValue="id" [multiple]="true" formControlName="groups"></ng-select>
                </div>
                <div class="mb-3">
                  <label class="form-label">Sucursales</label>
                  <ng-select [items]="sucursales" bindLabel="name" bindValue="id" [multiple]="true" formControlName="sucursales"></ng-select>
                </div>
                <button type="submit" class="btn btn-primary" [disabled]="saving">Guardar</button>
              </form>
            }
          </div>
        </div>
      </div>
      <div class="col-lg-4 col-md-12">
        <div class="card">
          <div class="card-body">
            <h6>Cambiar contraseña</h6>
            @if (passwordErrorMessage) {
              <div class="alert alert-danger">{{ passwordErrorMessage }}</div>
            }
            <form [formGroup]="passwordForm" (ngSubmit)="changePassword()">
              <div class="mb-3">
                <label class="form-label">Nueva contraseña</label>
                <input type="password" class="form-control" formControlName="password" />
              </div>
              <div class="mb-3">
                <label class="form-label">Confirmar contraseña</label>
                <input type="password" class="form-control" formControlName="password_confirm" />
              </div>
              <button type="submit" class="btn btn-secondary">Cambiar contraseña</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
