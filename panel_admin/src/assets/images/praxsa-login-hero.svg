<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 640" width="480" height="640" role="img" aria-label="PRAXSA Window Film">
  <defs>
    <linearGradient id="heroSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1330"/>
      <stop offset="55%" stop-color="#122354"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="heroOverlay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0b1330" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="carBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="carGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <rect width="480" height="640" fill="url(#heroSky)"/>

  <!-- Distant city skyline, kept abstract/generic -->
  <g opacity="0.5" fill="#1e293b">
    <rect x="20" y="300" width="40" height="160"/>
    <rect x="70" y="260" width="30" height="200"/>
    <rect x="110" y="320" width="45" height="140"/>
    <rect x="330" y="280" width="35" height="180"/>
    <rect x="375" y="310" width="30" height="150"/>
    <rect x="415" y="250" width="40" height="210"/>
  </g>
  <g opacity="0.35" fill="#334155">
    <rect x="150" y="340" width="28" height="120" />
    <rect x="190" y="360" width="24" height="100" />
    <rect x="260" y="350" width="26" height="110" />
    <rect x="295" y="330" width="30" height="130" />
  </g>

  <!-- Car silhouette, side profile, stylized -->
  <g transform="translate(40, 420)">
    <!-- shadow -->
    <ellipse cx="200" cy="165" rx="190" ry="18" fill="#000000" opacity="0.35"/>

    <!-- body -->
    <path d="M10 120
             C 5 90, 30 70, 60 68
             L 95 40
             C 115 24, 150 14, 190 14
             L 280 14
             C 310 14, 330 26, 345 46
             L 365 68
             C 385 70, 400 88, 398 112
             L 396 128
             C 396 138, 388 146, 378 146
             L 350 146
             C 350 128, 336 114, 318 114
             C 300 114, 286 128, 286 146
             L 130 146
             C 130 128, 116 114, 98 114
             C 80 114, 66 128, 66 146
             L 34 146
             C 20 146, 10 136, 10 122
             Z"
          fill="url(#carBody)"/>

    <!-- windows (tinted, brand color) -->
    <path d="M110 66
             L 140 38
             C 154 28, 172 22, 190 22
             L 190 66
             Z"
          fill="url(#carGlass)"/>
    <path d="M200 22
             L 276 22
             C 296 22, 312 32, 324 48
             L 336 66
             L 200 66
             Z"
          fill="url(#carGlass)"/>

    <!-- door line -->
    <line x1="200" y1="66" x2="200" y2="146" stroke="#0b1330" stroke-width="3" opacity="0.6"/>

    <!-- wheels -->
    <circle cx="98" cy="146" r="30" fill="#0b1330"/>
    <circle cx="98" cy="146" r="14" fill="#475569"/>
    <circle cx="318" cy="146" r="30" fill="#0b1330"/>
    <circle cx="318" cy="146" r="14" fill="#475569"/>

    <!-- headlight -->
    <ellipse cx="392" cy="100" rx="7" ry="10" fill="#facc15" opacity="0.9"/>
  </g>

  <!-- brand gradient overlay for legibility of the login card edge -->
  <rect width="480" height="640" fill="url(#heroOverlay)"/>

  <text x="40" y="110" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" letter-spacing="1">Más control,</text>
  <text x="40" y="150" fill="#60a5fa" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" letter-spacing="1">más confort.</text>
  <rect x="40" y="172" width="60" height="4" fill="#60a5fa"/>
  <text x="40" y="210" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="15">Soluciones en láminas de control solar</text>
  <text x="40" y="232" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="15">y seguridad automotriz.</text>
</svg>
