worker_processes 8;
user root;
error_log  /var/log/nginx/error.log;
pid /var/run/nginx.pid;
events {}
http {
    include mime.types;
    upstream praxsa_server {
        server web:5000;
    }
    upstream praxsa_page {
        server proforma:4000;
    }

    server {
        listen 80 default_server;

        server_name oscarleon.website;

        return 301 https://$host$request_uri;
    }

    server {

        listen 443 ssl;

        ssl_certificate /web/ssl/oscarleon_website_chain.crt;

        ssl_certificate_key /web/ssl/server.key;

        server_name oscarleon.website laminas.oscarleon.website;

        location / {
            root /etc/nginx/html/;
            index index.html index.htm;
            try_files $uri $uri/ /index.html =404;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $http_host;
            proxy_redirect off;
            proxy_pass http://praxsa_page;
        }

        location /laminas/ { # copy your STATIC_URL here
            autoindex on;
            alias /etc/nginx/html/; # copy your static file path here
            try_files $uri $uri/ /index.html =404;
            index index.html index.htm;
        }

    }
    server {
        listen 443 ssl; 
        ssl_certificate /web/ssl/oscarleon_website_chain.crt;

        ssl_certificate_key /web/ssl/server.key;

        server_name panel.oscarleon.website; # copy Your server name here
        location / {
            proxy_pass http://praxsa_server; # copy main hostname here
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_redirect off;
        }
        location /static/ { # copy your STATIC_URL here
            autoindex on;
            alias /praxsa_manager/staticfiles/; # copy your static file path here
        }
    }

}