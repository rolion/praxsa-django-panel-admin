    server {
        listen 8081; 
        server_name localhost 127.0.0.1; # copy Your server name here
        location / {
            proxy_pass http://praxsa_server; # copy main hostname here
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_redirect off;
        }
        location /static/ { # copy your STATIC_URL here
            autoindex on;
            alias /praxsa_manager/staticfiles/; # copy your static file path here
        }
    }
}