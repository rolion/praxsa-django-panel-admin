<app-top-menu></app-top-menu>
<div class="container">
  <div class="title">
    <h1 class="text-center">Praxsa - Calculadora de precios</h1>
<div class="">
  <form  #reportForm="ngForm"  class="">
    <div class="row justify-content-center form-row">
      <div class="form-group col-md-3 col-sm-12">
        <div class="input-group-prepend">
          <label class="input-group-text" for="marca">Marcar</label>
        </div> 
        <select class="custom-select form-select"
                aria-label="Default select example"
                [(ngModel)]="selectedMarcaId"
                (change)="getModelos()"
                id="marca"
                name="marca"
                required
        >
          <option [value]="-1">..Marca</option>
          <option
            *ngFor="let marca of dao.marcas"

            value={{marca.id}}>{{marca.nombre}}
          </option>
        </select>
      </div>
      <div class="form-group col-md-3 col-sm-12">
        <div class="input-group-prepend">
          <label class="input-group-text" for="modelo">Modelos</label>
        </div>
        <select class="custom-select form-select"
                aria-label="Default select example"
                [(ngModel)]="selectedModelId"
                (change)="loadTable()"
                id="modelo"
                name="modelo"
                required
        >
          <option value="-1">..Modelo</option>
          <option
            *ngFor="let modelo of modelosByMarca"
            value={{modelo.id}}>{{modelo.nombre}}
          </option>
        </select>
      </div>
    </div>
  </form>
</div>
<div class="row ">
  <div class="col-sm-12 col-md-5 mx-auto">
    <p class="helper-text">seleccione una lamina para los items que necesita</p>
  </div>
  <div class="col-sm-12 col-md-8 mx-auto">
    <div class="table-responsive-lg ">
      <table class="table table-striped" id="proformaTable">
        <thead>
        <tr>
          <th scope="col" >Item</th>
          <th scope="col" >LAMINA</th>
          <th scope="col" class ='d-none d-sm-none d-md-table-cell'>SIMULADOR</th>
          <th scope="col" >SUBTOTAL (Bs)</th>
          <th scope="col" class='d-none d-sm-none d-md-table-cell'></th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let reportItem of invoiceItem; index as i">
          <td>{{reportItem.car_part_name}}</td>
          <td>
            <select class="custom-select form-select"
                    aria-label="Default select example"
                    (change)="addLamina($event, i)"
                    required
            >
              <option value="-1">..Lamina</option>
              <option
                *ngFor="let lamina of dao.films"
                value={{lamina.name}}>{{lamina.name}}
              </option>
            </select>

          </td>
          <td class="d-none d-sm-none d-md-table-cell"><a
            *ngIf="reportItem.window_film_name; else elseBlock"
            href="#/"
            target="_blank"
          >ver más</a></td>
          <ng-template #elseBlock>Seleccione una Lamina.</ng-template>

          <td>{{reportItem.price.toFixed(2)}}</td>
          <td class="d-none d-sm-none d-md-table-cell"><button type="button" class="btn btn-danger" (click)="removeReportItem(i)">X</button></td>
        </tr>
        </tbody>
      </table>
      <div class="container-fluid d-flex justify-content-end">
        <p class="fw-bold text-right" >Total: {{total.toFixed(2)}} Bs</p>
      </div>
    </div>
  </div>
</div>
<div class="d-flex justify-content-center">

    <button 
    class="btn btn-primary" (click)="openModal()">
      Crear Proforma
      <fa-icon [icon]="faPen">
      </fa-icon>
    </button>
    <a href="https://wa.me/59169272109"  target="_blank" class="btn btn-success">
      Consultas
      <fa-icon [icon]="faWhatsapp"></fa-icon>
    </a>
</div>
</div>
</div>
