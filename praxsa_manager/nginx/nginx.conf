worker_processes 8;
user root;
error_log  /var/log/nginx/error.log;
pid /var/run/nginx.pid;
events {}
http {
    include mime.types;
    upstream praxsa_server {
        server web:5000;
    }
    server {
        listen 80; 
        # server_name localhost; # copy Your server name here
        location / {
            proxy_pass http://praxsa_server; # copy main hostname here
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # proxy_set_header Host $http_host;
            proxy_set_header Host $host;
            # proxy_set_header X-Real-IP $remote_addr;
            # proxy_set_header X-Forwarded-Host $server_name;
            # proxy_set_header X-Forwarded-Proto https;
            proxy_redirect off;
        }
        location /static/ { # copy your STATIC_URL here
            autoindex on;
            alias /praxsa_manager/staticfiles/; # copy your static file path here
        }
    }
}