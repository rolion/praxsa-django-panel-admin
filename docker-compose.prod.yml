version: '3.1'

services:
  web:
    container_name: web
    build:
      context: praxsa_manager/
      dockerfile: Dockerfile.prod
    volumes:
      - static:/praxsa_manager/staticfiles
      - ./praxsa_manager/logs:/praxsa_manager/logs
    restart: always
    expose:
      - "5000"
    networks:
      - proxy
    depends_on:
      - db
    deploy:
      resources:
        limits:
          memory: 100M

  
  nginx:
    container_name: nginx
    build:
      context: nginx/
      dockerfile: Dockerfile.prod
    expose:
      - "80"
    deploy:
      resources:
        limits:
          memory: 100M
    volumes:
      - static:/praxsa_manager/staticfiles
      - laminas:/etc/nginx/html
    environment:
      - VIRTUAL_HOST=panel.praxsasrl.store,www.panel.praxsasrl.store,praxsasrl.store,laminas.praxsasrl.store,www.laminas.praxsasrl.store,honey.praxsasrl.store
      - LETSENCRYPT_HOST=panel.praxsasrl.store,www.panel.praxsasrl.store,praxsasrl.store,laminas.praxsasrl.store,www.laminas.praxsasrl.store,honey.praxsasrl.store
      - LETSENCRYPT_EMAIL=roleonm@gmail.com
    networks:
      - proxy
    depends_on:
      - web

  proforma:
    container_name: proforma
    build:
      context: proforma/
      dockerfile: Dockerfile.prod
    restart: always
    volumes:
      - laminas:/app/dist/proforma/browser
    expose:
      - "4000"
    networks:
      - proxy
    depends_on:
      - web
    deploy:
      resources:
        limits:
          memory: 2.5G

  db:
    container_name: db
    image: postgres
    restart: always
    env_file: praxsa_manager/.env
    volumes:
      - postgres:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - proxy
    deploy:
      resources:
        limits:
          memory: 100M

  adminer:
    image: adminer
    restart: always
    ports:
      - "8080"
    networks:
      - proxy

volumes:
  postgres:
    external: true
  static:
    external: true
  laminas:
    external: true

networks:
  proxy:
    external: true