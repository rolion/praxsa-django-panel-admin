version: '3.1'

services:
  web:
    container_name: web
    build:
      context: praxsa_manager/
      dockerfile: Dockerfile
    volumes:
      - static:/praxsa_manager/staticfiles
    restart: always
    ports:
      - "5000:5000"
    networks:
      - web_nw
    depends_on:
      - db
    deploy:
      resources:
        limits:
          memory: 100M

  
  nginx:
    container_name: nginx
    build:
      context: nginx/
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"
      - "8081:8081"
      - "443:443"
    deploy:
      resources:
        limits:
          memory: 100M
    volumes:
      - static:/praxsa_manager/staticfiles
      - laminas:/etc/nginx/html
      - /ssl/:/web/ssl
    networks:
      - web_nw
    depends_on:
      - web

  proforma:
    container_name: proforma
    build:
      context: proforma/
      dockerfile: Dockerfile
    restart: always
    volumes:
      - laminas:/app/dist/proforma/browser
    ports:
      - "4000:4000"
    networks:
      - web_nw
    depends_on:
      - web
    deploy:
      resources:
        limits:
          memory: 2.5G

  db:
    container_name: db
    image: postgres
    restart: always
    env_file: praxsa_manager/.env
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - 5432:5432
    networks:
      - web_nw
    deploy:
      resources:
        limits:
          memory: 100M

  # adminer:
  #   image: adminer
  #   restart: always
  #   ports:
  #     - 8080:8080
  #   networks:
  #     - nginx_nw

volumes:
  postgres:
    external: true
  static:
    external: true
  laminas:
    external: true

networks:
  web_nw:
    external: true
  nginx_nw:
    external: true